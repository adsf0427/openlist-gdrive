<p>A personal, single-user OAuth client that lets a self-hosted <a href="https://github.com/OpenListTeam/OpenList">OpenList</a> server list, upload and download files in the owner's own Google Drive.</p>
<p>It is not offered to the public. Only the owner of this project signs in with it.</p>
